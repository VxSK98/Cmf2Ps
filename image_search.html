<!-- Фрагмент загружается image-search.js в отдельную панель; события связывает image-search.js. -->
<section class="image-search-panel" aria-label="Image search">
  <header class="image-search-header">
    <div>
      <div class="image-search-header-actions">
        <!-- <h1 class="image-search-title">Image Search</h1> -->
        <!-- <p class="image-search-subtitle">Google и Яндекс · SerpApi</p> -->
      </div>
    </div>
  </header>
  <div class="image-search-controls">
    <label class="image-search-field">
      <!-- <span>Источник</span> -->
    </label>

    <label class="image-search-field">
      <!-- <span>Поисковый запрос</span> -->
      <div class="image-search-query-row">
        <sp-textfield
          id="imageSearchQueryField"
          placeholder="Ввод запроса" data-i18n-placeholder="placeholders.searchQuery"
        ></sp-textfield>
        <div class="padding-down"></div>
        <sp-action-button id="imageSearchButton" data-i18n="actions.searchGo">Поиск</sp-action-button>
      </div>
      <div class="padding-down"></div>
    </label>
  </div>

  <section class="image-search-preview" aria-label="Preview">
    <div class="image-search-preview-toolbar">
      <div class="image-search-preview-title-row">
        <!-- <h2 class="image-search-preview-title">Превью</h2> -->
        <div class="padding-down"></div>
        <sp-action-button id="imageSearchNextButton" data-i18n="actions.searchAdd" disabled
          >Найти ещё</sp-action-button
        >
      </div>
      <span id="imageSearchStatus" data-i18n="search.waiting" data-i18n-title="search.waiting" class="image-search-status"
        >Ожидает запрос</span
      >
    </div>
    <!-- Начальное пустое состояние. Карточки результатов добавляет функция createResultCard. -->
    <div id="imageSearchPreviewGrid" class="image-search-preview-grid">
      <div class="image-search-empty" data-i18n="search.empty">Здесь появятся результаты поиска</div>
    </div>
  </section>
</section>
